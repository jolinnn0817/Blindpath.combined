<script>
/*
  BlindPath voice journey
  Paste after your existing application scripts, before </body>.
*/
(() => {
  "use strict";

  if (document.getElementById("bpVoiceDock")) return;

  const $ = id => document.getElementById(id);

  const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  /* ---------- Accessible layout ---------- */

  const style = document.createElement("style");

  style.textContent = `
    body {
      padding-bottom: 145px;
    }

    #bpVoiceDock {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 1100;
      background: white;
      padding:
        10px
        16px
        calc(10px + env(safe-area-inset-bottom));
      border-top: 3px solid #145b42;
      box-shadow: 0 -3px 14px #0002;
    }

    #bpVoiceMain {
      display: block;
      width: 100%;
      min-height: 76px;
      font-size: 24px;
      font-weight: 800;
      background: #145b42;
      color: white;
      border: 3px solid #083d29;
      border-radius: 14px;
      cursor: pointer;
    }

    #bpVoiceDock p {
      margin: 3px 0 0;
      text-align: center;
      font-size: 14px;
      color: #173c2d;
    }

    #bpVoicePanel {
      position: fixed;
      inset: 5vh 12px auto;
      max-height: 74vh;
      overflow: auto;
      z-index: 1200;
      background: white;
      color: #162f24;
      border: 3px solid #145b42;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 0 0 100vmax #0007;
      max-width: 760px;
      margin: auto;
      font: 19px/1.5 system-ui;
    }

    #bpVoicePanel[hidden] {
      display: none;
    }

    #bpVoicePanel h2 {
      margin-top: 0;
    }

    #bpVoicePanel button,
    #bpVoicePanel input,
    #bpVoicePanel select {
      font: inherit;
      min-height: 52px;
      padding: 10px;
      border: 2px solid #42634f;
      border-radius: 8px;
    }

    #bpVoicePanel button {
      background: #145b42;
      color: white;
      cursor: pointer;
    }

    #bpVoicePanel input {
      width: 100%;
      box-sizing: border-box;
    }

    #bpVoicePanel .bpVoiceRow {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 12px 0;
    }

    #bpVoicePanel .bpVoiceRow > * {
      flex: 1;
    }

    #bpVoiceChoices button {
      display: block;
      width: 100%;
      text-align: left;
      margin: 8px 0;
    }

    #bpVoicePanel :focus-visible,
    #bpVoiceMain:focus-visible {
      outline: 4px solid #d47a00;
      outline-offset: 3px;
    }

    #bpVoiceStatus {
      white-space: pre-line;
      font-weight: 650;
    }
  `;

  document.head.appendChild(style);

  const dock = document.createElement("div");
  dock.id = "bpVoiceDock";

  dock.innerHTML = `
    <button
      id="bpVoiceMain"
      type="button"
      aria-controls="bpVoicePanel"
      aria-expanded="false"
    >
      🎤 Speak your journey
    </button>

    <p>Voice journey button · bottom of the screen</p>
  `;

  document.body.appendChild(dock);

  const panel = document.createElement("section");

  panel.id = "bpVoicePanel";
  panel.hidden = true;

  panel.setAttribute("role", "dialog");
  panel.setAttribute("aria-modal", "true");
  panel.setAttribute("aria-labelledby", "bpVoiceTitle");

  panel.innerHTML = `
    <h2 id="bpVoiceTitle" tabindex="-1">
      Speak your journey
    </h2>

    <p>
      The large microphone button is at the bottom of the screen.
      Activate Listen below, then say:
      “Take me from Kinabalu to Kompleks Perdanasiswa, UM.”
      You can also say:
      “Take me to the main library from my current location.”
    </p>

    <label for="bpVoiceLanguage">
      Recognition language
    </label>

    <select id="bpVoiceLanguage">
      <option value="en-MY">English (Malaysia)</option>
      <option value="ms-MY">Bahasa Melayu</option>
    </select>

    <p>
      Listening starts only when you activate a microphone button.
      Your browser may send audio to its speech provider.
      BlindPath does not save recordings or transcripts.
    </p>

    <p
      id="bpVoiceStatus"
      role="status"
      aria-live="polite"
    >
      Ready.
    </p>

    <div class="bpVoiceRow">
      <button id="bpVoiceListen" type="button">
        🎤 Listen
      </button>

      <button id="bpVoiceRepeat" type="button">
        Read prompt again
      </button>
    </div>

    <label for="bpVoiceText">
      Or type your journey or command
    </label>

    <input
      id="bpVoiceText"
      placeholder="Take me from … to …"
      autocomplete="off"
    >

    <div class="bpVoiceRow">
      <button id="bpVoiceUse" type="button">
        Use this text
      </button>

      <button id="bpVoiceCancel" type="button">
        Cancel and close
      </button>
    </div>

    <div id="bpVoiceChoices"></div>

    <div id="bpVoiceConfirmation" hidden>
      <p id="bpVoiceMatched"></p>

      <div class="bpVoiceRow">
        <button id="bpVoiceConfirm" type="button">
          Confirm and find route
        </button>

        <button id="bpVoiceChange" type="button">
          Change journey
        </button>
      </div>
    </div>
  `;

  document.body.appendChild(panel);

  /* ---------- State ---------- */

  let generation = 0;
  let recognition = null;
  let recognitionSerial = 0;

  let phase = "journey";
  let pending = null;
  let choices = [];
  let choiceField = "";
  let prompt = "";

  let searchTail = Promise.resolve();
  let lastSearch = 0;
  let request = null;

  let inertElements = [];

  /* ---------- Spoken feedback ---------- */

  function say(text) {
    if (!("speechSynthesis" in window)) return;

    speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(text);

    utterance.lang = $("bpVoiceLanguage").value;
    utterance.rate = 1;

    speechSynthesis.speak(utterance);
  }

  function tell(text) {
    prompt = text;
    $("bpVoiceStatus").textContent = text;

    say(text);
  }

  function stopListening() {
    recognitionSerial++;

    if (recognition) {
      try {
        recognition.abort();
      } catch (_) {}
    }

    recognition = null;

    $("bpVoiceListen").textContent = "🎤 Listen";

    $("bpVoiceListen").setAttribute(
      "aria-pressed",
      "false"
    );
  }

  /* ---------- Open, close and reset ---------- */

  function reset() {
    generation++;

    stopListening();

    if (request) request.abort();

    request = null;
    phase = "journey";
    pending = null;
    choices = [];

    $("bpVoiceChoices").replaceChildren();
    $("bpVoiceConfirmation").hidden = true;
    $("bpVoiceText").value = "";
    $("bpVoiceConfirm").disabled = false;
  }

  function close() {
    reset();

    panel.hidden = true;

    for (const [element, previous] of inertElements) {
      element.inert = previous;
    }

    inertElements = [];

    $("bpVoiceMain").setAttribute(
      "aria-expanded",
      "false"
    );

    if ("speechSynthesis" in window) {
      speechSynthesis.cancel();
    }

    $("bpVoiceMain").focus();
  }

  function open() {
    if (!panel.hidden) {
      if (phase !== "busy") listen();
      return;
    }

    if (window.stopGuidance) {
      window.stopGuidance(false);
    }

    reset();

    panel.hidden = false;

    /*
      Keep keyboard and screen-reader navigation
      inside the open dialog.
    */
    inertElements = [...document.body.children]
      .filter(element => {
        return (
          element !== panel &&
          !["SCRIPT", "STYLE", "LINK"].includes(element.tagName)
        );
      })
      .map(element => [element, element.inert]);

    for (const [element] of inertElements) {
      element.inert = true;
    }

    $("bpVoiceMain").setAttribute(
      "aria-expanded",
      "true"
    );

    $("bpVoiceTitle").focus();

    if (Recognition) {
      tell(
        "The voice journey button is at the bottom of the screen. " +
        "Activate Listen, then say take me from a place to a place. " +
        "You can also type your journey."
      );
    } else {
      tell(
        "Speech recognition is unavailable in this browser. " +
        "Type your journey below. " +
        "Read aloud and confirmation controls are still available."
      );
    }
  }

  /* ---------- Understand journey sentences ---------- */

  function tidy(text) {
    return text
      .trim()
      .replace(/[.!?。]+$/g, "")
      .trim();
  }

  function parseJourney(text) {
    const value = tidy(text);

    /*
      Examples:
      Take me from A to B.
      I want to go from A to B.
    */
    let match = value.match(
      /^(?:.*?\b)?from\s+(.+?)\s+to\s+(.+)$/i
    );

    if (match) {
      return {
        start: tidy(match[1]),
        destination: tidy(match[2])
      };
    }

    /*
      Example:
      Take me to B from my current location.
    */
    match = value.match(
      /^(?:take me|bring me|navigate|go|i want to go|i would like to go)\s+to\s+(.+?)\s+from\s+(.+)$/i
    );

    if (match) {
      return {
        start: tidy(match[2]),
        destination: tidy(match[1])
      };
    }

    /*
      Example:
      Saya ingin pergi dari A ke B.
    */
    match = value.match(
      /(?:^|\s)dari\s+(.+?)\s+ke\s+(.+)$/i
    );

    if (match) {
      return {
        start: tidy(match[1]),
        destination: tidy(match[2])
      };
    }

    /*
      Example:
      Take me to B.
      A current-location starting point will be requested.
    */
    match = value.match(
      /^(?:take me|bring me|navigate|go|i want to go|i would like to go)\s+to\s+(.+)$/i
    );

    if (match) {
      return {
        start: "my current location",
        destination: tidy(match[1])
      };
    }

    return null;
  }

  function isCurrentLocation(text) {
    return /^(?:my\s+)?(?:current location|location|here|lokasi semasa|lokasi saya)$/i
      .test(text.trim());
  }

  function normalizePlace(text) {
    const colleges = [
      "Tuanku Abdul Rahman",
      "Tuanku Bahiyah",
      "Tuanku Kurshiah",
      "Bestari",
      "Dayasari",
      "Ibnu Sina",
      "Za’ba",
      "Kinabalu",
      "Tun Syed Zahiruddin",
      "Tun Ahmad Zaidi",
      "Ungku Aziz",
      "Raja Dr Nazrin Shah"
    ];

    const collegeMatch = text.trim().match(
      /^kk\s*(\d{1,2})(?:\s*,?\s*(?:um|universiti malaya))?$/i
    );

    if (collegeMatch) {
      const college = colleges[Number(collegeMatch[1]) - 1];

      if (college) {
        return (
          "Kolej Kediaman " +
          college +
          ", Universiti Malaya"
        );
      }
    }

    return text
      .replace(
        /kompleks\s+(?:persona\s+siswa|perdana\s+siswa|perdanasiswa)/ig,
        "Kompleks Perdanasiswa"
      )
      .replace(/\bUM\b/ig, "Universiti Malaya");
  }

  /* ---------- Current location ---------- */

  function getCurrentLocation(token) {
    return new Promise((resolve, reject) => {
      if (!navigator.geolocation) {
        reject(new Error("Location is not supported."));
        return;
      }

      navigator.geolocation.getCurrentPosition(
        position => {
          if (token !== generation) {
            reject(new Error("Journey cancelled."));
            return;
          }

          const stale =
            Date.now() - position.timestamp > 15000;

          if (stale || position.coords.accuracy > 30) {
            reject(
              new Error(
                "Current location is too uncertain. " +
                "Move outdoors and retry, or name a starting place."
              )
            );

            return;
          }

          resolve({
            lat: position.coords.latitude,
            lon: position.coords.longitude,
            name: "My current location",
            accuracy: position.coords.accuracy,
            timestamp: position.timestamp
          });
        },
        () => {
          reject(
            new Error(
              "Location permission was denied or location is unavailable. " +
              "Name a starting place instead."
            )
          );
        },
        {
          enableHighAccuracy: true,
          maximumAge: 0,
          timeout: 15000
        }
      );
    });
  }

  /* ---------- Place search ---------- */

  async function search(text, token) {
    const coordinateMatch = text.match(
      /^(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)$/
    );

    if (
      coordinateMatch &&
      Math.abs(Number(coordinateMatch[1])) <= 90 &&
      Math.abs(Number(coordinateMatch[2])) <= 180
    ) {
      return [{
        lat: Number(coordinateMatch[1]),
        lon: Number(coordinateMatch[2]),
        name: text
      }];
    }

    /*
      Explicit searches are queued and spaced.
      This does not query on each keystroke.
    */
    const task = searchTail.then(async () => {
      const wait = Math.max(
        0,
        1100 - (Date.now() - lastSearch)
      );

      await new Promise(resolve => {
        setTimeout(resolve, wait);
      });

      if (token !== generation) {
        throw new Error("Journey cancelled.");
      }

      lastSearch = Date.now();

      request = new AbortController();

      const activeRequest = request;

      const timeout = setTimeout(() => {
        activeRequest.abort();
      }, 12000);

      try {
        const url =
          "https://nominatim.openstreetmap.org/search" +
          "?format=jsonv2&limit=3&q=" +
          encodeURIComponent(normalizePlace(text));

        const response = await fetch(url, {
          signal: activeRequest.signal,
          headers: {
            "Accept-Language": "en"
          }
        });

        if (!response.ok) {
          throw new Error(
            "Place search is unavailable. Please retry later."
          );
        }

        const data = await response.json();

        return data.map(place => ({
          lat: Number(place.lat),
          lon: Number(place.lon),
          name: place.display_name
        }));
      } finally {
        clearTimeout(timeout);

        if (request === activeRequest) {
          request = null;
        }
      }
    });

    searchTail = task.catch(() => {});

    return task;
  }

  function fail(error, token) {
    if (token !== generation) return;

    phase = "journey";
    pending = null;

    $("bpVoiceChoices").replaceChildren();
    $("bpVoiceConfirmation").hidden = true;

    const message =
      error.name === "AbortError"
        ? "Place search timed out."
        : error.message;

    tell(
      message +
      " Please speak or type the journey again."
    );
  }

  /* ---------- Resolve and confirm both locations ---------- */

  async function resolveNext(token) {
    if (token !== generation) return;

    const field =
      !pending.start
        ? "start"
        : !pending.destination
          ? "destination"
          : null;

    if (!field) {
      phase = "confirm";

      $("bpVoiceChoices").replaceChildren();
      $("bpVoiceConfirmation").hidden = false;

      const start = pending.start;
      const destination = pending.destination;

      const accuracyText = start.accuracy
        ? (
          "Starting GPS accuracy is plus or minus " +
          Math.round(start.accuracy) +
          " metres. "
        )
        : "";

      const text =
        "Starting from " +
        start.name +
        ". Going to " +
        destination.name +
        ". " +
        accuracyText +
        "Is that correct? " +
        "Activate Listen and say confirm, change journey, or cancel. " +
        "You can also use the buttons.";

      $("bpVoiceMatched").textContent = text;

      tell(text);
      return;
    }

    phase = "busy";

    const name = pending.names[field];

    tell(
      "Finding the " +
      (field === "start" ? "starting point" : "destination") +
      ": " +
      name +
      "."
    );

    try {
      if (isCurrentLocation(name)) {
        pending[field] = await getCurrentLocation(token);

        return resolveNext(token);
      }

      const results = await search(name, token);

      if (token !== generation) return;

      if (!results.length) {
        throw new Error(
          "Could not find " +
          name +
          ". Try its full name and city."
        );
      }

      if (results.length === 1) {
        pending[field] = results[0];

        return resolveNext(token);
      }

      phase = "choice";
      choices = results;
      choiceField = field;

      $("bpVoiceChoices").replaceChildren();

      results.forEach((place, index) => {
        const button = document.createElement("button");

        button.type = "button";

        button.textContent =
          "Option " +
          (index + 1) +
          ": " +
          place.name;

        button.onclick = () => choose(index);

        $("bpVoiceChoices").appendChild(button);
      });

      const optionsText = results
        .map((place, index) => {
          return (
            "Option " +
            (index + 1) +
            ": " +
            place.name
          );
        })
        .join(". ");

      tell(
        "Several matches for the " +
        (field === "start" ? "starting point" : "destination") +
        ". " +
        optionsText +
        ". Activate Listen and say option one, two, or three, " +
        "or select a button."
      );
    } catch (error) {
      fail(error, token);
    }
  }

  function choose(index) {
    if (phase !== "choice" || !choices[index]) return;

    stopListening();

    pending[choiceField] = choices[index];
    choices = [];

    $("bpVoiceChoices").replaceChildren();

    resolveNext(generation);
  }

  function confirm() {
    if (
      phase !== "confirm" ||
      !pending ||
      !pending.start ||
      !pending.destination
    ) {
      return;
    }

    const journey = pending;

    if (
      journey.start.timestamp &&
      Date.now() - journey.start.timestamp > 60000
    ) {
      phase = "journey";
      pending = null;

      $("bpVoiceConfirmation").hidden = true;

      tell(
        "Your current location is now old. " +
        "Please speak the journey again to refresh it."
      );

      return;
    }

    stopListening();

    phase = "busy";
    $("bpVoiceConfirm").disabled = true;

    close();

    window.goTo("navigation");
    window.clearRoute();

    /*
      Pass the confirmed coordinates to the existing router.
      Do not search the names again and risk selecting another place.
    */
    $("start").value =
      journey.start.lat +
      ", " +
      journey.start.lon;

    $("destination").value =
      journey.destination.lat +
      ", " +
      journey.destination.lon;

    $("bpVoiceLocationSummary").textContent =
      "Voice-confirmed start: " +
      journey.start.name +
      ". Destination: " +
      journey.destination.name +
      ".";

    window.findRoute();
  }

  /* ---------- Commands ---------- */

  function handle(raw) {
    const text = tidy(raw);
    const command = text.toLowerCase();

    if (/^(cancel|close|stop|batal|tutup)$/.test(command)) {
      close();
      return;
    }

    if (/^(repeat|repeat that|ulang)$/.test(command)) {
      say(prompt);
      return;
    }

    if (
      /^(change journey|change|start again|no|ubah|tidak)$/
        .test(command)
    ) {
      reset();

      tell(
        "Say take me from your starting point to your destination."
      );

      return;
    }

    if (phase === "busy") {
      tell(
        "A place search is still running. " +
        "Please wait, or cancel."
      );

      return;
    }

    if (
      phase === "confirm" &&
      /^(confirm|yes|yes confirm|correct|sahkan|ya|betul)$/
        .test(command)
    ) {
      confirm();
      return;
    }

    if (phase === "choice") {
      const match = command.match(
        /^(?:option\s*|pilihan\s*)?(1|2|3|one|two|three|satu|dua|tiga)$/
      );

      const optionNumbers = {
        "1": 0,
        one: 0,
        satu: 0,
        "2": 1,
        two: 1,
        dua: 1,
        "3": 2,
        three: 2,
        tiga: 2
      };

      const index = match
        ? optionNumbers[match[1]]
        : undefined;

      if (
        index !== undefined &&
        choices[index]
      ) {
        choose(index);
        return;
      }
    }

    if (pending && phase === "confirm") {
      const match = text.match(
        /^change\s+(start|starting point|destination)\s+to\s+(.+)$/i
      );

      if (match) {
        const field =
          match[1].toLowerCase() === "destination"
            ? "destination"
            : "start";

        pending.names[field] = match[2];
        pending[field] = null;

        $("bpVoiceConfirmation").hidden = true;

        resolveNext(generation);
        return;
      }
    }

    const journey = parseJourney(text);

    if (!journey) {
      tell(
        "I could not understand that. " +
        "Say take me from a starting place to a destination. " +
        "Or say take me to a destination to use your current location."
      );

      return;
    }

    reset();

    pending = {
      names: journey,
      start: null,
      destination: null
    };

    resolveNext(generation);
  }

  /* ---------- Microphone ---------- */

  function listen() {
    if (!Recognition) {
      tell(
        "Speech recognition is unavailable. " +
        "Type your journey or command below " +
        "and activate Use this text."
      );

      $("bpVoiceText").focus();
      return;
    }

    if (recognition) {
      stopListening();

      tell(
        "Listening stopped. Activate Listen to try again."
      );

      return;
    }

    if (phase === "busy") {
      tell(
        "Please wait for the place search, or cancel."
      );

      return;
    }

    if ("speechSynthesis" in window) {
      speechSynthesis.cancel();
    }

    const recognizer = new Recognition();
    const serial = ++recognitionSerial;

    recognition = recognizer;

    recognizer.lang = $("bpVoiceLanguage").value;
    recognizer.continuous = false;
    recognizer.interimResults = false;
    recognizer.maxAlternatives = 1;

    let received = false;

    $("bpVoiceListen").textContent = "■ Stop listening";

    $("bpVoiceListen").setAttribute(
      "aria-pressed",
      "true"
    );

    $("bpVoiceStatus").textContent =
      "Listening. Speak now.";

    recognizer.onresult = event => {
      if (serial !== recognitionSerial) return;

      received = true;

      const transcript =
        event.results[0][0].transcript;

      stopListening();
      handle(transcript);
    };

    recognizer.onerror = event => {
      if (serial !== recognitionSerial) return;

      received = true;

      stopListening();

      if (
        event.error === "not-allowed" ||
        event.error === "service-not-allowed"
      ) {
        tell(
          "Microphone access was denied. " +
          "Allow microphone permission in browser settings, " +
          "or type the journey."
        );
      } else {
        tell(
          "Speech recognition failed: " +
          event.error +
          ". Please retry or type the journey."
        );
      }
    };

    recognizer.onend = () => {
      if (serial !== recognitionSerial) return;

      stopListening();

      if (!received) {
        tell(
          "No speech was recognised. " +
          "Activate Listen to retry, or type the journey."
        );
      }
    };

    try {
      recognizer.start();
    } catch (_) {
      stopListening();

      tell(
        "Microphone could not start. " +
        "Try again or type your journey."
      );
    }
  }

  /* ---------- Buttons ---------- */

  $("bpVoiceMain").onclick = open;
  $("bpVoiceListen").onclick = listen;

  $("bpVoiceRepeat").onclick = () => {
    stopListening();
    say(prompt);
  };

  $("bpVoiceCancel").onclick = close;
  $("bpVoiceConfirm").onclick = confirm;

  $("bpVoiceChange").onclick = () => {
    reset();

    tell(
      "Say take me from your starting place to your destination."
    );
  };

  $("bpVoiceUse").onclick = () => {
    stopListening();

    handle($("bpVoiceText").value);
  };

  $("bpVoiceText").addEventListener("keydown", event => {
    if (event.key === "Enter") {
      event.preventDefault();

      $("bpVoiceUse").click();
    }
  });

  /* ---------- Keyboard accessibility ---------- */

  panel.addEventListener("keydown", event => {
    if (event.key === "Escape") {
      event.preventDefault();

      close();
      return;
    }

    if (event.key !== "Tab") return;

    const controls = [
      ...panel.querySelectorAll(
        'button,input,select,[tabindex="0"]'
      )
    ].filter(element => {
      return (
        !element.disabled &&
        element.getClientRects().length
      );
    });

    if (!controls.length) return;

    const first = controls[0];
    const last = controls[controls.length - 1];

    if (
      event.shiftKey &&
      (
        document.activeElement === first ||
        document.activeElement === $("bpVoiceTitle")
      )
    ) {
      event.preventDefault();
      last.focus();
    } else if (
      !event.shiftKey &&
      document.activeElement === last
    ) {
      event.preventDefault();
      first.focus();
    }
  });

  /* ---------- Show confirmed place names ---------- */

  const locationSummary = document.createElement("p");

  locationSummary.id = "bpVoiceLocationSummary";
  locationSummary.setAttribute("role", "status");

  $("routeStatus").insertAdjacentElement(
    "beforebegin",
    locationSummary
  );

  for (const id of ["start", "destination"]) {
    $(id).addEventListener("input", () => {
      locationSummary.textContent = "";
    });
  }

  /*
    Explain the button following a deliberate interaction.
    Do not attempt to autoplay speech on page load.
  */
  function introduce(event) {
    if (
      event.type === "keydown" &&
      !["Enter", " "].includes(event.key)
    ) {
      return;
    }

    document.removeEventListener(
      "pointerup",
      introduce,
      true
    );

    document.removeEventListener(
      "keydown",
      introduce,
      true
    );

    if (
      dock.contains(event.target) ||
      panel.contains(event.target)
    ) {
      return;
    }

    if (
      event.target.closest(
        "button,a,input,select,textarea"
      )
    ) {
      return;
    }

    say(
      "BlindPath has a large Speak your journey button " +
      "at the bottom of the screen."
    );
  }

  document.addEventListener(
    "pointerup",
    introduce,
    true
  );

  document.addEventListener(
    "keydown",
    introduce,
    true
  );

  /* ---------- Stop listening when leaving ---------- */

  document.addEventListener("visibilitychange", () => {
    if (document.hidden && !panel.hidden) {
      close();
    }
  });

  window.addEventListener("pagehide", () => {
    reset();

    if ("speechSynthesis" in window) {
      speechSynthesis.cancel();
    }
  });

  window.BlindPathVoiceJourney = {
    parseJourney,
    normalizePlace
  };
})();
</script>
